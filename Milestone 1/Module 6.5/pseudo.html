<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo</title>
    <style>
        h1:hover {
            color: aqua;
        }

        input:focus {
            outline-color: aqua;
            /* outline: 0 ; */
        }

        a:visited {
            color: red;
        }
        li:nth-child(2n){
            color: greenyellow;
            /* background-color: aqua; */
        }
        li:last-child{
            color: brown;
        }
    </style>
</head>

<body>
    <h1>Some Pseudo Example</h1>
    <input type="text"><br>
    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.facebook.com/">facebook</a><br>
    <a href="https://www.facebook.com/">facebook</a><br>

    <ol>
        
        <li>a</li>
        <li>b</li>
        <li>c</li>
        <li>a</li>
        <li>b</li>
        <li>c</li>
        <li>a</li>
        <li>b</li>
        <li>c</li>
        <li>a</li>
        <li>b</li>
        <li>c</li>
        <li>a</li>
        <li>b</li>
        <li>c</li>
    </ol>


</body>

</html>
