<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex {
            border: 5px solid green;
            height: 500px;
            width: 500px;

            display: flex;

            justify-content: space-around;
            justify-content: space-between;
            justify-content: space-evenly;

            text-align: start;
            text-align: center;
            text-align: end;
            text-align: left;
            text-align: right;

            flex-direction: column;
            flex-direction: column-reverse;
            flex-direction: row;
            flex-direction: row-reverse;

            flex-wrap: wrap;
            flex-wrap: wrap-reverse;
            flex-wrap: nowrap;
            
        }

        .flex h1 {
            border: 5px double red;
            height: 100px;
            width: 100px;

        }
    </style>
</head>

<body>

    <div class="flex">
        <h1>box1</h1>
        <h1>box2</h1>
        <h1>box3</h1>
    </div>

</body>

</html>
