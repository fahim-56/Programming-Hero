<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task2 html</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            height: 720px;
            background: lightskyblue;
            color: aliceblue;
            font-size: 2em;
            margin: 0px;
            padding: 0px;
        }

        .left {
            background: rgb(246, 17, 93);
            grid-row: span 2;
        }

        .top {
            background: orange;
            grid-column: span 2;
        }

        .bottom1 {
            background: rgb(209, 12, 209);
        }

        .bottom2 {
            background: grey;
        }

        @media screen and (max-width:800px) {
            .container {
                display: flex;
                flex-direction: column;
                height: 600px;
            }

            .left {
                height: 150px;
            }

            .top {
                height: 150px;
            }

            .bottom1 {
                height: 150px;
            }

            .bottom2 {
                height: 150px;
            }

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box left">1</div>
        <div class="box top">2</div>
        <div class="box bottom1">3</div>
        <div class="box bottom2">4</div>
    </div>
</body>

</html>
