<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task1</title>
    <style>
        .grey {
            background-color: grey;
            width: 100%;
            height: 360px;
            border: 2px solid grey;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .light {
            background-color: lightcyan;
            width: 100%;
            height: 360px;
            border: 2px solid lightcyan;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media screen and (max-width: 700px) {
            .container {
                display: flex;
                justify-content: space-between;
            }

            .grey {
                background-color: grey;
                width: 50%;
                height: 720px;
            }

            .light {
                background-color: lightcyan;
                width: 50%;
                height: 720px;

            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="grey">
            <h1>Top</h1>
        </div>
        <div class="light">
            <h1>Bottom</h1>
        </div>
    </div>
</body>

</html>
